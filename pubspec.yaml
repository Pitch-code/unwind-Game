name: unwind
description: "Unwind — a calm untangle puzzle. Drag the pins so no ropes cross."
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

# Launcher icon generation. The source PNGs are produced by tool/make_icon.py.
# CI runs `dart run flutter_launcher_icons` after `flutter create`, before the
# build, to write every Android density + the adaptive icon.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/ic_master.png"
  adaptive_icon_background: "#16271F"
  adaptive_icon_foreground: "assets/icon/ic_foreground.png"
  min_sdk_android: 23
