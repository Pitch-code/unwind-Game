name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version

      # pub get resolves dependencies (needs network — GitHub runners have it).
      - run: flutter pub get

      # Fails the build on any analyzer issue, including lints.
      - run: flutter analyze

      # Runs the pure-Dart puzzle tests: crossing maths and the level generator.
      - run: flutter test
