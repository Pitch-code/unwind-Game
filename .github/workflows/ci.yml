name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version

      # Resolves dependencies (needs network — GitHub runners have it).
      - run: flutter pub get

      # Fails the build on any analyzer issue, including lints.
      - run: flutter analyze

      # Runs the pure-Dart puzzle tests: crossing maths, generator, transform.
      - run: flutter test

  apk:
    # Only build the app if it compiles clean and the logic passes.
    needs: verify
    runs-on: ubuntu-latest
    env:
      # Real AdMob ids. These are NOT secrets — they ship inside every APK and
      # are visible to anyone. The debug build below still shows Google's TEST
      # ads (it passes no ADMOB_INTERSTITIAL_ID, so the app falls back to the
      # test ad unit); only the release build wires the real ad unit. This is
      # what keeps playtesting safe from self-click account bans.
      ADMOB_APP_ID: "ca-app-pub-2526578065051760~7160117289"
      ADMOB_INTERSTITIAL_ID: "ca-app-pub-2526578065051760/1072211921"
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # We don't commit the Android project (it includes a binary Gradle
      # wrapper that can't be authored by hand). Flutter regenerates it here
      # from pubspec + lib, without touching either. When we need to customise
      # the manifest (AdMob) or sign a release, we'll commit the curated files.
      - run: flutter create --platforms=android --org com.pitchcode --project-name unwind .

      - run: flutter pub get

      # Generate every launcher density + the adaptive icon from the committed
      # source PNGs (assets/icon/*, produced by tool/make_icon.py).
      - run: dart run flutter_launcher_icons

      # Re-apply the AdMob customisations flutter create can't know about:
      # the AdMob app id in the manifest and minSdk 23 for google_mobile_ads.
      - name: Configure Android for AdMob
        run: python3 tool/patch_android.py

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: unwind-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      # Verify the release path bundles too, wired with the REAL interstitial
      # unit. Flutter's template points the release build at the debug signing
      # config, so this produces a debug-signed .aab — enough to prove the real
      # ad config compiles and shrinks. A real Play upload still needs proper
      # release signing (see docs/RELEASE.md); it is not signed for release here.
      - run: flutter build appbundle --release --dart-define=ADMOB_INTERSTITIAL_ID=$ADMOB_INTERSTITIAL_ID

      - uses: actions/upload-artifact@v4
        with:
          name: unwind-release-aab-unsigned
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
